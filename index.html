<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Itinerario (5 días) - Import/Export</title>
  <style>
    :root{
      --bg:#0b1020;
      --card:#121a33;
      --card2:#0f1630;
      --text:#eef2ff;
      --muted:#b9c2ff;
      --line:rgba(255,255,255,.12);
      --accent:#7c9cff;
      --danger:#ff6b6b;
      --ok:#49d17c;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
      --pad: clamp(14px, 2.3vw, 20px);
      --max: 980px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--font);
      background: radial-gradient(1200px 800px at 20% -10%, rgba(124,156,255,.28), transparent 55%),
                  radial-gradient(900px 600px at 110% 20%, rgba(73,209,124,.18), transparent 50%),
                  var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{max-width:var(--max); margin:0 auto; padding: clamp(14px, 3vw, 26px);}
    header{
      display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
      margin-bottom: 14px;
    }
    .title{
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--pad);
      box-shadow: var(--shadow);
      flex:1;
    }
    .title h1{margin:0 0 6px 0; font-size: clamp(18px, 2.6vw, 26px); letter-spacing:.2px;}
    .title p{margin:0; color:var(--muted); line-height:1.35; font-size: 14px;}
    .actions{
      display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end;
    }
    button{
      appearance:none; border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      color:var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      transition: transform .08s ease, border-color .2s ease, background .2s ease;
      font-weight: 650;
      font-size: 13px;
      display:inline-flex; align-items:center; gap:8px;
      white-space:nowrap;
    }
    button:hover{border-color: rgba(124,156,255,.5)}
    button:active{transform: translateY(1px)}
    button.secondary{background: rgba(255,255,255,.03)}
    button.danger{border-color: rgba(255,107,107,.35)}
    button.danger:hover{border-color: rgba(255,107,107,.65)}
    button.ok{border-color: rgba(73,209,124,.35)}
    button.ok:hover{border-color: rgba(73,209,124,.65)}

    .nav{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin: 16px 0 14px 0;
      padding: 12px;
      border-radius: var(--radius);
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
    }
    .nav .left, .nav .right{display:flex; gap:10px; align-items:center;}
    .nav .center{
      display:flex; flex-direction:column; align-items:center; gap:8px;
      text-align:center;
      flex:1;
      min-width: 160px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:10px;
      padding: 8px 12px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }
    .dots{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
    .dot{
      width: 10px; height:10px; border-radius:999px;
      background: rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
    }
    .dot.active{
      background: var(--accent);
      border-color: rgba(124,156,255,.8);
      box-shadow: 0 0 0 4px rgba(124,156,255,.18);
    }

    .card{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .dayHeader{
      padding: var(--pad);
      display:flex; flex-wrap:wrap;
      align-items:flex-start; justify-content:space-between; gap:12px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.12);
    }
    .dayHeader h2{margin:0; font-size: clamp(16px, 2.2vw, 22px);}
    .meta{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end;
      color:var(--muted); font-size: 13px;
    }
    .meta span{
      border:1px solid var(--line);
      background: rgba(0,0,0,.16);
      padding: 6px 10px;
      border-radius: 999px;
    }
    .content{padding: var(--pad);}
    .hint{
      margin: 0 0 12px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .list{display:flex; flex-direction:column; gap:10px;}
    .item{
      display:grid;
      grid-template-columns: 120px 1fr 44px;
      gap:10px;
      padding: 10px;
      border-radius: 16px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
    }
    .item input[type="time"]{
      width:100%;
      padding: 10px 10px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-weight: 650;
      outline:none;
    }
    .item textarea{
      width:100%;
      min-height: 44px;
      resize: vertical;
      padding: 10px 10px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      color: var(--text);
      outline:none;
      font-size: 14px;
      line-height: 1.35;
    }
    .iconBtn{
      width:44px; height:44px;
      border-radius: 14px;
      display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      color: var(--text);
      font-weight: 900;
      user-select:none;
    }
    .iconBtn:hover{border-color: rgba(255,107,107,.55); color: var(--danger)}
    .rowActions{
      margin-top: 12px;
      display:flex; gap:10px; flex-wrap:wrap;
    }

    .notes{
      margin-top: 16px;
      border-top: 1px dashed rgba(255,255,255,.18);
      padding-top: 14px;
    }
    .notes label{display:block; color:var(--muted); font-size: 13px; margin-bottom: 8px;}
    .notes textarea{
      width:100%;
      min-height: 100px;
      resize: vertical;
      padding: 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      color: var(--text);
      outline:none;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 720px){
      header{flex-direction:column; align-items:stretch;}
      .actions{justify-content:flex-start}
      .item{grid-template-columns: 1fr; }
      .iconBtn{justify-self:end}
      .nav{flex-wrap:wrap}
      .nav .left, .nav .right{width:100%; justify-content:space-between}
      .nav .center{order:-1; width:100%}
    }

    @media print{
      body{background:white; color:black;}
      .actions, .nav, .rowActions, .iconBtn{display:none !important;}
      .card{box-shadow:none; border-color:#ddd}
      .item{background:#fff; border-color:#ddd}
      .item textarea, .item input, .notes textarea{border-color:#ddd; background:#fff; color:#000}
      .title{box-shadow:none; border-color:#ddd}
      .title p{color:#333}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>Itinerario editable (5 días)</h1>
        <p>
          Se guarda localmente en cada dispositivo. Para pasar los cambios a otro dispositivo usa:
          <b>Exportar JSON</b> en uno y <b>Importar JSON</b> en el otro.
        </p>
      </div>
      <div class="actions">
        <button class="secondary" id="btnCopy">📋 Copiar resumen</button>
        <button class="secondary" id="btnExport">⬇️ Exportar JSON</button>
        <button class="secondary" id="btnImport">⬆️ Importar JSON</button>
        <button class="secondary" id="btnPrint">🖨️ Imprimir</button>
        <button class="danger" id="btnReset">🧹 Reset</button>
        <input type="file" id="fileInput" accept="application/json" hidden />
      </div>
    </header>

    <div class="nav">
      <div class="left">
        <button id="prevBtn" class="secondary">⬅️ Anterior</button>
      </div>

      <div class="center">
        <div class="pill" id="dayCounter">Día 1 de 5</div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="right">
        <button id="nextBtn" class="secondary">Siguiente ➡️</button>
      </div>
    </div>

    <main class="card" id="dayCard" aria-live="polite"></main>
  </div>

  <script>
    const STORAGE_KEY = "itinerario_5dias_v1";

    const defaultPlan = [
      {
        dayTitle: "Martes 24",
        place: "CDMX (DF)",
        focus: "Llegada + compras + Bellas Artes",
        activities: [
          { time: "14:30", text: "Llegada a DF a las 2:30 pm." },
          { time: "",      text: "Almorzar y buscar ropa para la boda de Pablo y Sara." },
          { time: "16:30", text: "Llegada al hotel y alistarse." },
          { time: "18:00", text: "Llegada al Teatro / Palacio de Bellas Artes." },
          { time: "22:00", text: "Regresar al hotel." }
        ],
        notes: ""
      },
      {
        dayTitle: "Miércoles 25",
        place: "CDMX → Tepoztlán",
        focus: "Traslado + despedida de soltero",
        activities: [
          { time: "", text: "Mañana en CDMX: (definir plan) — ¿desayuno? ¿paseo corto?" },
          { time: "", text: "Viaje a Tepoztlán (hora por definir)." },
          { time: "", text: "Check-in / acomodarse (si aplica)." },
          { time: "", text: "Noche: despedida de soltero." }
        ],
        notes: "Pendiente: definir hora de salida, transporte, y lugar exacto de la despedida."
      },
      {
        dayTitle: "Jueves 26",
        place: "Tepoztlán",
        focus: "Explorar + subir pirámide + boda",
        activities: [
          { time: "",      text: "Conocer la zona durante la mañana." },
          { time: "",      text: "Subir la pirámide / Tepozteco (hora por definir)." },
          { time: "",      text: "¿Hay un desayuno compartido? (confirmar)." },
          { time: "17:00", text: "Boda (Pablo y Sara) a las 5:00 pm." }
        ],
        notes: ""
      },
      {
        dayTitle: "Viernes 27",
        place: "Tepoztlán → CDMX (DF)",
        focus: "Regreso + Iglesia",
        activities: [
          { time: "", text: "Regresar a DF (hora por definir)." },
          { time: "", text: "Ir a la Iglesia (definir cuál y a qué hora)." }
        ],
        notes: ""
      },
      {
        dayTitle: "Sábado 28",
        place: "CDMX (DF)",
        focus: "Pirámides + pendiente",
        activities: [
          { time: "", text: "Pirámides (¿Teotihuacán?) — definir hora y transporte." },
          { time: "", text: "Actividad pendiente: ________" }
        ],
        notes: ""
      }
    ];

    // Normaliza un plan importado para evitar errores si falta algún campo.
    function normalizePlan(maybePlan) {
      const base = structuredClone(defaultPlan);

      if (!Array.isArray(maybePlan) || maybePlan.length !== 5) return base;

      return maybePlan.map((d, idx) => {
        const safe = base[idx];

        const dayTitle = typeof d?.dayTitle === "string" ? d.dayTitle : safe.dayTitle;
        const place    = typeof d?.place    === "string" ? d.place    : safe.place;
        const focus    = typeof d?.focus    === "string" ? d.focus    : safe.focus;
        const notes    = typeof d?.notes    === "string" ? d.notes    : "";

        const actsRaw = Array.isArray(d?.activities) ? d.activities : safe.activities;
        const activities = actsRaw.map(a => ({
          time: (typeof a?.time === "string") ? a.time : "",
          text: (typeof a?.text === "string") ? a.text : ""
        }));

        return { dayTitle, place, focus, activities, notes };
      });
    }

    function loadPlan() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultPlan);
        return normalizePlan(JSON.parse(raw));
      } catch {
        return structuredClone(defaultPlan);
      }
    }

    function savePlan(plan) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(plan));
    }

    let plan = loadPlan();
    let currentIndex = 0;

    const dayCard = document.getElementById("dayCard");
    const dayCounter = document.getElementById("dayCounter");
    const dots = document.getElementById("dots");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function renderDots() {
      dots.innerHTML = "";
      for (let i = 0; i < plan.length; i++) {
        const d = document.createElement("div");
        d.className = "dot" + (i === currentIndex ? " active" : "");
        d.title = `Ir a ${plan[i].dayTitle}`;
        d.tabIndex = 0;
        d.setAttribute("role", "button");
        d.setAttribute("aria-label", `Ir a ${plan[i].dayTitle}`);
        d.addEventListener("click", () => showDay(i));
        d.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") showDay(i);
        });
        dots.appendChild(d);
      }
    }

    function showDay(idx) {
      currentIndex = Math.max(0, Math.min(plan.length - 1, idx));
      renderDay();
      renderDots();
      updateNavState();
    }

    function updateNavState() {
      dayCounter.textContent = `Día ${currentIndex + 1} de ${plan.length}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === plan.length - 1;
      prevBtn.style.opacity = prevBtn.disabled ? .55 : 1;
      nextBtn.style.opacity = nextBtn.disabled ? .55 : 1;
    }

    function addActivity(dayIdx) {
      plan[dayIdx].activities.push({ time: "", text: "" });
      savePlan(plan);
      renderDay();
    }

    function removeActivity(dayIdx, actIdx) {
      plan[dayIdx].activities.splice(actIdx, 1);
      savePlan(plan);
      renderDay();
    }

    function renderDay() {
      const d = plan[currentIndex];

      dayCard.innerHTML = `
        <div class="dayHeader">
          <div>
            <h2>${escapeHtml(d.dayTitle)}</h2>
          </div>
          <div class="meta">
            <span>📍 ${escapeHtml(d.place || "")}</span>
            <span>🎯 ${escapeHtml(d.focus || "")}</span>
          </div>
        </div>

        <div class="content">
          <p class="hint">
            Edita horas y actividades. Para sincronizar entre dispositivos:
            <b>Exporta JSON</b> en uno → pásalo (AirDrop/iCloud/WhatsApp archivo) → <b>Importa JSON</b> en el otro.
          </p>

          <div class="list" id="list"></div>

          <div class="rowActions">
            <button class="ok" id="btnAdd">➕ Agregar actividad</button>
          </div>

          <div class="notes">
            <label for="notes">Notas del día (editable)</label>
            <textarea id="notes" placeholder="Notas, pendientes, direcciones, etc."></textarea>
          </div>
        </div>
      `;

      const list = dayCard.querySelector("#list");

      d.activities.forEach((a, i) => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <input type="time" value="${escapeAttr(a.time || "")}" aria-label="Hora actividad ${i+1}">
          <textarea aria-label="Descripción actividad ${i+1}" placeholder="Actividad...">${escapeHtml(a.text || "")}</textarea>
          <div class="iconBtn" title="Eliminar" aria-label="Eliminar actividad" role="button">✕</div>
        `;

        const timeInput = row.querySelector('input[type="time"]');
        const textArea = row.querySelector("textarea");
        const delBtn = row.querySelector(".iconBtn");

        timeInput.addEventListener("input", () => {
          plan[currentIndex].activities[i].time = timeInput.value;
          savePlan(plan);
        });
        textArea.addEventListener("input", () => {
          plan[currentIndex].activities[i].text = textArea.value;
          savePlan(plan);
        });
        delBtn.addEventListener("click", () => removeActivity(currentIndex, i));

        list.appendChild(row);
      });

      const notes = dayCard.querySelector("#notes");
      notes.value = d.notes || "";
      notes.addEventListener("input", () => {
        plan[currentIndex].notes = notes.value;
        savePlan(plan);
      });

      dayCard.querySelector("#btnAdd").addEventListener("click", () => addActivity(currentIndex));
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replaceAll("\n", " ");
    }

    // Nav buttons
    prevBtn.addEventListener("click", () => showDay(currentIndex - 1));
    nextBtn.addEventListener("click", () => showDay(currentIndex + 1));

    // Keyboard shortcuts: ← / →
    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
      if (e.key === "ArrowLeft") showDay(currentIndex - 1);
      if (e.key === "ArrowRight") showDay(currentIndex + 1);
    });

    // Actions
    document.getElementById("btnPrint").addEventListener("click", () => window.print());

    document.getElementById("btnReset").addEventListener("click", () => {
      if (!confirm("¿Resetear a la versión inicial? Se perderán cambios guardados en este dispositivo.")) return;
      localStorage.removeItem(STORAGE_KEY);
      plan = structuredClone(defaultPlan);
      currentIndex = 0;
      renderDots();
      renderDay();
      updateNavState();
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "itinerario_5dias.json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 800);
    });

    document.getElementById("btnCopy").addEventListener("click", async () => {
      const text = plan.map((d, idx) => {
        const lines = [];
        lines.push(`${idx+1}) ${d.dayTitle} — ${d.place} — ${d.focus}`);
        d.activities.forEach(a => {
          const t = (a.time && a.time.trim()) ? a.time : "—";
          lines.push(`   • ${t}  ${a.text || ""}`.trimEnd());
        });
        if (d.notes && d.notes.trim()) {
          lines.push(`   Notas: ${d.notes.trim()}`);
        }
        return lines.join("\n");
      }).join("\n\n");

      try {
        await navigator.clipboard.writeText(text);
        alert("Resumen copiado al portapapeles ✅");
      } catch {
        prompt("Copia manualmente:", text);
      }
    });

    // Import JSON
    const fileInput = document.getElementById("fileInput");
    document.getElementById("btnImport").addEventListener("click", () => {
      fileInput.value = "";
      fileInput.click();
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      try {
        const text = await file.text();
        const importedRaw = JSON.parse(text);
        const imported = normalizePlan(importedRaw);

        // Confirmación opcional porque sobreescribe el estado local
        const ok = confirm("Esto reemplazará el itinerario guardado en ESTE dispositivo. ¿Continuar?");
        if (!ok) return;

        plan = imported;
        savePlan(plan);
        currentIndex = 0;
        renderDots();
        renderDay();
        updateNavState();
        alert("Importado ✅");
      } catch {
        alert("No pude importar ese archivo. Asegúrate de que sea un JSON exportado por esta misma página.");
      }
    });

    // Init
    renderDots();
    renderDay();
    updateNavState();
  </script>
</body>
</html>
